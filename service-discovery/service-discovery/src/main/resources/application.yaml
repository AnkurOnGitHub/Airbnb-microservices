spring:
  application:
    name: service-discovery
server:
  port: 8761

eureka:
  client:
    # disable the server from registering itself as a discovery client
    register-with-eureka: false
    # disable the server from fetching the registry list from other peers
    fetch-registry: false
    # The URL where discovery clients will locate this registry server
    service-url:
      defaultZone: http://localhost:8761/eureka/
